name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain for integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb-multiarch gcc-arm-none-eabi qemu-system-arm

      - name: Test
        run: |
          pip install -e '.[test]' build
          pytest -v

      - name: Check tag matches package version
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }

      - name: Build wheel, sdist and zip
        run: |
          python -m build
          name="renode-gdb-mcp-${GITHUB_REF_NAME#v}"
          git archive --format=zip --prefix="$name/" -o "dist/$name.zip" HEAD
          ls -l dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: renode-gdb-mcp ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: dist/*
